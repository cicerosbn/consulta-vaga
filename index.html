<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morada de Piatã - Consulta de Vaga de Garagem</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
	  
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body>

<header class="topbar">
  <div class="topbar-content">
    <img src="img/moradadepiata.png" alt="Condomínio Morada de Piatã" class="logo">
    <div class="topbar-text">
      <h1>Morada de Piatã</h1>
      <span>Consulta de Vaga de Garagem</span>
    </div>
  </div>
  <div class="topbar-line"></div>
</header>

<main class="container">
  <section class="card">
    <h2> Informe os dados abaixo </h2>

    <form id="consultaForm" class="form-grid">
      <div class="field">
        <label for="torre">Torre</label>
		<select id="torre">
		  <option value="">Selecione</option>
		</select>
      </div>

      <div class="field">
        <label for="apto">Apartamento</label>
        <select id="apto" disabled>
          <option value="">Selecione</option>
        </select>
      </div>

      <div class="actions">
        <button type="submit">Consultar</button>
      </div>
    </form>

    <div id="resultado" class="resultado"></div>
  </section>
</main>

<footer class="footer">
  <span>© Desenvolvido por Santiago (v1.0.0-dev)</span>
</footer>

<script src="script.js"></script>
</body>
</html>
