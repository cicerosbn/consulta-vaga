<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta de Vaga de Garagem</title>

  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== TOPO ===== -->
  <div class="topbar">
    <div class="topbar-content">
      <img src="morada_de_piata.png" alt="Morada de Piatã" class="logo" />
      <div class="topbar-text">
        <h1>Consulta de Vaga de Garagem</h1>
        <span>Condomínio Morada de Piatã</span>
      </div>
    </div>
  </div>

  <!-- ===== CONTEÚDO ===== -->
  <main class="container">

    <!-- ===== CARD 1: TORRE / APARTAMENTO ===== -->
    <div class="card">
      <h2>Informe os dados abaixo</h2>

      <form id="consultaForm" class="form-grid">
        <div class="field">
          <label for="torre">Torre</label>
          <select id="torre">
            <option value="">Selecione</option>
            <option value="1">Torre 1</option>
            <option value="2">Torre 2</option>
            <option value="3">Torre 3</option>
            <option value="4">Torre 4</option>
            <option value="5">Torre 5</option>
          </select>
        </div>

        <div class="field">
          <label for="apto">Apartamento</label>
          <select id="apto" disabled>
            <option value="">Selecione</option>
          </select>
        </div>

        <div class="actions">
          <button type="submit">Consultar</button>
        </div>
      </form>

      <div id="resultado" class="resultado"></div>
    </div>

    <!-- ===== CARD 2: CONSULTA POR VAGA ===== -->
    <div class="card">
      <h2>Consultar por número da vaga</h2>

      <form id="consultaVagaForm" class="form-grid">
        <div class="field">
          <label for="numeroVaga">Número da vaga</label>
          <input
            type="number"
            id="numeroVaga"
            placeholder="Ex: 335"
            min="1"
          />
        </div>

        <div class="actions">
          <button type="submit">Localizar vaga</button>
        </div>
      </form>

      <div id="resultadoVaga" class="resultado"></div>
    </div>

    <!-- ===== CARD 3: LOCALIZAÇÃO DA VAGA ===== -->
    <div id="cardLocalizacao" class="card hidden">
      <h2>Localização da Vaga</h2>

      <div class="mapa-container">
        <img
          src="img/mapa_condominio.png"
          alt="Mapa do condomínio"
          id="mapaImg"
        />
        <canvas id="mapaCanvas"></canvas>
      </div>
    </div>

  </main>

  <!-- ===== RODAPÉ ===== -->
  <footer class="footer">
    © Desenvolvido por Santiago
  </footer>

  <script src="script.js"></script>
</body>
</html>
